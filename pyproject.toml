    "accelerate>=1.10.1",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "atomics>=1.0.3",
    "av>=15.1.0",
    "boto3>=1.42.97",
    "cython==0.29.*",
    "diffusers>=0.36.0",
    "dill>=0.4.1",
    "einops>=0.8.2",
    "fastcrc>=0.3.6",
    "free-mujoco-py==2.1.6",
    "gym>=0.26.2",
    "hydra-core>=1.3.4",
    "imagecodecs>=2024.12.30",
    "ipykernel>=6.31.0",
    "k3d>=2.17.0",
    "lmdb>=2.2.1",
    "matplotlib>=3.9.4",
    "numba>=0.60.0",
    "numcodecs>=0.12.1",
    "numpy==1.24.*",
    "opencv-python==4.7.*",
    "pandas>=2.3.3",
    "pynput>=1.8.2",
    "pyyaml>=6.0.3",
    "ray[default]==2.8.0",
    "scikit-fda>=0.9.1",
    "scikit-video>=1.1.11",
    "scipy>=1.13.1",
    "threadpoolctl>=3.6.0",
    "timm>=1.0.27",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.68.4",
    "ur-rtde>=1.6.3",
    "v4l2py>=3.0.0",
    "wandb>=0.26.1",
    "zarr>=2.18.2",
    "spnav @ https://github.com/cheng-chi/spnav/archive/c1c938ebe3cc542db4685e0d13850ff1abfdb943.tar.gz",
    "robosuite @ https://github.com/cheng-chi/robosuite/archive/3f2c3116f1c0a1916e94bfa28da4d055927d1ab3.tar.gz",
    "pyexiftool>=0.5.6",
